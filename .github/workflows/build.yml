name: Build

on:
  push:
    branches:
      - main
    paths:
      - 'Plain Craft Launcher 2/**'
      - '.github/workflows/**'
    tags:
      - '*'
  pull_request:
    paths:
      - 'Plain Craft Launcher 2/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (Release)
    runs-on: windows-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 1
        submodules: true

    - name: Set Describe
      shell: bash
      run: |
          describe=`git describe --tags --always 2>/dev/null || git rev-parse --short HEAD`
          echo "describe=$describe" >> $GITHUB_ENV

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v3
      with:
        msbuild-architecture: x64

    # 帮助库更新失败不影响编译，仓库里已有 Resources\Help.zip 兜底
    - name: Update Help
      continue-on-error: true
      run:  |
        Set-Location ..
        git clone https://github.com/LTCatt/PCL2Help.git -b master --single-branch --depth 1
        Set-Location PCL2Help
        Remove-Item -Path *.* -Recurse -Force
        Compress-Archive -Path .\* -DestinationPath .\Help.zip
        Copy-Item -Path .\Help.zip -Destination "${{ github.workspace }}\Plain Craft Launcher 2\Resources\Help.zip" -Force
        Set-Location ..
        Remove-Item PCL2Help -Recurse -Force
        Set-Location ${{ github.workspace }}

    # 把仓库 Secrets 里的密钥注入源码，编译进 exe
    # 注意：必须用 .Replace()（字面替换）；用 -replace 时 ( ) 会被当成正则分组，匹配不上源码
    - name: Replace Secrets
      shell: pwsh
      run: |
        $enc = New-Object System.Text.UTF8Encoding($false)
        $p = "Plain Craft Launcher 2\Modules\ModSecret.vb"
        $t = Get-Content $p -Raw -Encoding UTF8
        $t = $t.Replace('Public CurseForgeAPIKey As String = If(Environment.GetEnvironmentVariable("PCL_CURSEFORGE_API_KEY"), "")', 'Public CurseForgeAPIKey As String = If(Environment.GetEnvironmentVariable("PCL_CURSEFORGE_API_KEY"), "${{ secrets.CURSEFORGE_API_KEY }}")')
        $t = $t.Replace('Public OAuthClientId As String = If(Environment.GetEnvironmentVariable("PCL_MS_CLIENT_ID"), "")', 'Public OAuthClientId As String = If(Environment.GetEnvironmentVariable("PCL_MS_CLIENT_ID"), "${{ secrets.CLIENT_ID }}")')
        [System.IO.File]::WriteAllText((Resolve-Path $p), $t, $enc)

        $b = "Plain Craft Launcher 2\Modules\Base\ModBase.vb"
        $tb = Get-Content $b -Raw -Encoding UTF8
        $tb = $tb.Replace('Public Const CommitHash As String = ""', 'Public Const CommitHash As String = "${{ github.sha }}"')
        [System.IO.File]::WriteAllText((Resolve-Path $b), $tb, $enc)

        if ($t -match 'GetEnvironmentVariable\("PCL_CURSEFORGE_API_KEY"\), ""') {
          throw "CurseForge API Key 注入失败：Secret 为空或名称不对"
        }
        if ($t -match 'GetEnvironmentVariable\("PCL_MS_CLIENT_ID"\), ""') {
          Write-Host "::warning::CLIENT_ID 未配置，正版登录仍不可用"
        }
        Write-Host "密钥注入完成"
    - name: Check Secrets
      shell: pwsh
      env:
        CFKEY: ${{ secrets.CURSEFORGE_API_KEY }}
        MSID: ${{ secrets.CLIENT_ID }}
      run: |
        if ([string]::IsNullOrWhiteSpace($env:CFKEY)) {
          Write-Host "::warning::未配置 CURSEFORGE_API_KEY，本次产物不带内置 CurseForge Key"
        } else {
          Write-Host "已注入 CurseForge API Key（长度 $($env:CFKEY.Length)）"
        }
        if ([string]::IsNullOrWhiteSpace($env:MSID)) {
          Write-Host "::warning::未配置 CLIENT_ID，正版登录仍不可用"
        } else {
          Write-Host "已注入微软登录 Client ID"
        }

    - name: Restore NuGet Packages
      run: dotnet restore PCLCS\PCLCS.csproj

    - name: Build
      run: msbuild "Plain Craft Launcher 2\Plain Craft Launcher 2.vbproj" -p:Configuration=Release

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7
      with:
        name: PCL-PersonalBuild-${{ env.describe }}
        path: Plain Craft Launcher 2\obj\Release\Plain Craft Launcher 2.exe